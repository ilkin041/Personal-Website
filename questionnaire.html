<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="True" href="https://fonts.gstatic.com" rel="preconnect"/><link href="style.css" rel="stylesheet"/></head>
<body>
<header id="top">
<h1>İlkin Hasanov — Personal Website </h1>

<hr class="fancy"/></header><div class="site-nav-wrap"><nav class="site-nav"><a href="index.html">Home</a><a href="education.html">Education</a><a href="schedule.html">Weekly Schedule</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact Me</a><a class="active" href="questionnaire.html">Questionnaire</a></nav></div>
<main>
<section>
<h2 class="section-title">Questionnaire</h2>
<form action="mailto:your.email@example.com" enctype="text/plain" method="POST">
<fieldset>
<legend>Basics</legend>
<label for="qname">Name:</label>
<input id="qname" name="Name" required="" type="text"/><br/><br/>
<label for="qemail">Email:</label>
<input id="qemail" name="Email" required="" type="email"/><br/><br/>
</fieldset>
<fieldset>
<legend>Yes/No &amp; Choices</legend>
<p>Do you enjoy math?</p>
<label><input checked="" name="Enjoys Math" type="radio" value="Yes"/> Yes</label>
<label><input name="Enjoys Math" type="radio" value="No"/> No</label>
<br/><br/>
<p>Which areas interest you? (choose any)</p>
<label><input name="Area: Algebra" type="checkbox" value="Yes"/> Algebra</label>
<label><input name="Area: Geometry" type="checkbox" value="Yes"/> Geometry</label>
<label><input name="Area: Calculus" type="checkbox" value="Yes"/> Calculus</label>
<label><input name="Area: AI" type="checkbox" value="Yes"/> AI</label>
<br/><br/>
<label for="level">Your current level:</label>
<select id="level" name="Level">
<option>Middle School</option>
<option>High School</option>
<option>Undergraduate</option>
<option>Graduate</option>
<option>Other</option>
</select><br/><br/>
</fieldset>
<fieldset>
<legend>Ratings</legend>
<label for="rating">Rate your interest in programming (0–10):</label>
<input id="rating" max="10" min="0" name="Programming Interest (0-10)" type="range" value="7"/><br/><br/>
<label for="hours">Hours per week you can study:</label>
<input id="hours" max="80" min="0" name="Study Hours/Week" type="number" value="5"/><br/><br/>
</fieldset>
<fieldset>
<legend>Comments</legend>
<label for="comments">Anything else to add?</label><br/>
<textarea cols="50" id="comments" name="Comments" rows="6"></textarea>
</fieldset>
<button type="submit">Submit Survey</button>
</form>
</section>
</main>
<footer>
<p>© 2025 İlkin Hasanov • <a href="#top">Back to top ↑</a></p>
</footer>
</body>
</html>
