<main>
<section>
<h2 class="section-title">Contact Me</h2>
<form action="mailto:your.email@example.com" class="container py-3" enctype="text/plain" method="POST">
<fieldset class="mb-3">
<legend>Your Details</legend>
<label class="form-label" for="name">Full Name:</label>
<input class="form-control" id="name" name="Name" required="" type="text"/>
<label class="form-label" for="email">Email:</label>
<input class="form-control" id="email" name="Email" required="" type="email"/>
<label class="form-label" for="tel">Phone:</label>
<input class="form-control" id="tel" name="Phone" type="tel"/>
</fieldset>
<fieldset class="mb-3">
<legend>Preferences</legend>
<p>Preferred contact method:</p>
<label class="form-label"><input checked="" name="Preferred Contact" type="radio" value="Email"/> Email</label>
<label class="form-label"><input name="Preferred Contact" type="radio" value="Phone"/> Phone</label>

<p>Topics you're interested in:</p>
<label class="form-label"><input name="Interest: Math" type="checkbox" value="Yes"/> Math</label>
<label class="form-label"><input name="Interest: Programming" type="checkbox" value="Yes"/> Programming</label>
<label class="form-label"><input name="Interest: AI" type="checkbox" value="Yes"/> AI</label>

<label class="form-label" for="source">How did you find me?</label>
<select class="form-control" id="source" name="Source">
<option>Search Engine</option>
<option>Social Media</option>
<option>Friend / Colleague</option>
<option>Event / Workshop</option>
</select>
<label class="form-label" for="meet">Preferred meeting date:</label>
<input class="form-control" id="meet" name="Meeting Date" type="date"/>
</fieldset>
<fieldset class="mb-3">
<legend>Your Message</legend>
<label class="form-label" for="subject">Subject:</label>
<input class="form-control" id="subject" name="Subject" required="" type="text"/>
<label class="form-label" for="message">Message:</label>
<textarea class="form-control" cols="50" id="message" name="Message" required="" rows="6"></textarea>
</fieldset>
<button class="btn btn-primary" type="submit">Send</button>
<button type="reset">Reset</button>
</form>
</section>
</main>
