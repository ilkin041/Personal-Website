<main>
  <section>
    <h2>Contact Me</h2>
    <form action="mailto:your.email@example.com" method="POST" enctype="text/plain">
      <fieldset>
        <legend>Your Details</legend>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="Name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="Email" required><br><br>

        <label for="tel">Phone:</label>
        <input type="tel" id="tel" name="Phone"><br><br>

      </fieldset>

      <fieldset>
        <legend>Preferences</legend>
        <p>Preferred contact method:</p>
        <label><input type="radio" name="Preferred Contact" value="Email" checked> Email</label>
        <label><input type="radio" name="Preferred Contact" value="Phone"> Phone</label>
        <br><br>

        <p>Topics you're interested in:</p>
        <label><input type="checkbox" name="Interest: Math" value="Yes"> Math</label>
        <label><input type="checkbox" name="Interest: Programming" value="Yes"> Programming</label>
        <label><input type="checkbox" name="Interest: AI" value="Yes"> AI</label>
        <br><br>

        <label for="source">How did you find me?</label>
        <select id="source" name="Source">
          <option>Search Engine</option>
          <option>Social Media</option>
          <option>Friend / Colleague</option>
          <option>Event / Workshop</option>
        </select><br><br>

        <label for="meet">Preferred meeting date:</label>
        <input type="date" id="meet" name="Meeting Date"><br><br>
      </fieldset>

      <fieldset>
        <legend>Your Message</legend>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="Subject" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="Message" rows="6" cols="50" required></textarea><br><br>
      </fieldset>

      <button type="submit">Send</button>
      <button type="reset">Reset</button>
    </form>
  </section>
</main>
